name: Joseon thumbnail collector

on:
  push:
    branches:
      - joseon-gallery
    paths:
      - "joseon-gallery/thumbnail-run.trigger"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum unresolved works to inspect; 0 means all"
        required: false
        default: "0"
      source:
        description: "Optional source-name filter"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: joseon-gallery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate split architecture
        run: node joseon-gallery/tests/thumbnail-architecture.test.cjs
      - name: Resolve collector inputs
        id: collector
        shell: bash
        run: |
          LIMIT="${{ inputs.limit }}"
          SOURCE="${{ inputs.source }}"
          if [ "${{ github.event_name }}" = "push" ] && [ -f joseon-gallery/thumbnail-run.trigger ]; then
            FILE_LIMIT="$(sed -n 's/^limit=//p' joseon-gallery/thumbnail-run.trigger | tail -n 1)"
            FILE_SOURCE="$(sed -n 's/^source=//p' joseon-gallery/thumbnail-run.trigger | tail -n 1)"
            if [ -n "$FILE_LIMIT" ]; then LIMIT="$FILE_LIMIT"; fi
            if [ -n "$FILE_SOURCE" ]; then SOURCE="$FILE_SOURCE"; fi
          fi
          if [ -z "$LIMIT" ]; then LIMIT="0"; fi
          echo "limit=$LIMIT" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "Collector source: $SOURCE"
          echo "Collector limit: $LIMIT"
      - name: Collect and verify unresolved thumbnails
        run: node joseon-gallery/scripts/collect-thumbnails.cjs --limit "${{ steps.collector.outputs.limit }}" --source "${{ steps.collector.outputs.source }}"
      - name: Validate results
        run: node joseon-gallery/tests/thumbnail-architecture.test.cjs
      - name: Commit verified URLs
        run: |
          git config user.name "joseon-thumbnail-bot"
          git config user.email "joseon-thumbnail-bot@users.noreply.github.com"
          git add joseon-gallery/thumbnails.json joseon-gallery/thumbnail-queue.json
          if git diff --cached --quiet; then
            echo "No thumbnail changes"
          else
            git commit -m "Update verified Joseon thumbnails"
            git push origin HEAD:joseon-gallery
          fi
