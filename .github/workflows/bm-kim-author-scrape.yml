name: British Museum Kim Jun-geun 10 thumbnails

on:
  workflow_dispatch:
  push:
    paths:
      - joseon-gallery/bm-kim-scrape.trigger

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: joseon-gallery
          fetch-depth: 0

      - name: Collect next 10 official thumbnails
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const {execFileSync}=require('child_process');

          const WORKS='joseon-gallery/works.json';
          const THUMBS='joseon-gallery/thumbnails.json';
          const QUEUE='joseon-gallery/thumbnail-queue.json';

          const wdoc=JSON.parse(fs.readFileSync(WORKS,'utf8'));
          const tdoc=JSON.parse(fs.readFileSync(THUMBS,'utf8'));
          const qdoc=JSON.parse(fs.readFileSync(QUEUE,'utf8'));

          const pending=wdoc.works.filter(w =>
            w.source==='British Museum · 김준근' &&
            !(tdoc.thumbnails?.[String(w.id)]?.verified && tdoc.thumbnails?.[String(w.id)]?.thumbnail)
          ).slice(0,10);

          function curlText(url,max=35){
            return execFileSync('curl',['-k','-L','--retry','2','--retry-delay','2','--retry-all-errors','--max-time',String(max),'-A','Mozilla/5.0','-sS',url],{
              encoding:'utf8',maxBuffer:50*1024*1024
            });
          }
          function verifyImage(url){
            const out=execFileSync('curl',['-L','--max-time','20','-A','Mozilla/5.0','-sS','-o','/dev/null','-w','%{http_code}\n%{content_type}',url],{
              encoding:'utf8',maxBuffer:1024*1024
            }).trim().split(/\r?\n/);
            return out[0]==='200' && String(out[1]||'').toLowerCase().startsWith('image/');
          }
          function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

          async function one(w){
            const m=String(w.url||'').match(/A_OA-0-482-(\d+)/);
            if(!m) return {id:w.id,ok:false,error:'registration'};
            const n=m[1], reg='OA+,0.482.'+n;
            const api='https://www.britishmuseum.org/api/_search?keyword%5B%5D=OA%2B%2C0.482.'+n;
            const url='https://r.jina.ai/'+api;
            try{
              const txt=curlText(url);
              const marker='Markdown Content:';
              const p=txt.indexOf(marker);
              const body=p>=0?txt.slice(p+marker.length):txt;
              const i=body.indexOf('{');
              if(i<0) return {id:w.id,ok:false,error:'no json: '+body.slice(0,120).replace(/\\s+/g,' ')};
              const j=JSON.parse(body.slice(i).trim());
              const hits=j?.hits?.hits||[];
              const hit=hits.find(h=>(h._source?.identifier||[]).some(x=>x.registration_number===reg))||hits[0];
              const s=hit?._source;
              if(!s) return {id:w.id,ok:false,error:'no hit'};
              const mm=(s.multimedia||[]).find(x=>x?.['@processed']?.preview?.location);
              const loc=mm?.['@processed']?.preview?.location;
              if(!loc) return {id:w.id,ok:false,error:'no preview'};
              const img='https://media.britishmuseum.org/media/'+loc;
              if(!verifyImage(img)) return {id:w.id,ok:false,error:'image verify'};
              tdoc.thumbnails[String(w.id)]={
                thumbnail:img,
                image:img,
                source:'British Museum · 김준근',
                verified:true,
                verifiedAt:'2026-10-21'
              };
              return {id:w.id,number:Number(n),ok:true,img};
            }catch(e){
              return {id:w.id,ok:false,error:(e.stderr?.toString()||e.message||String(e)).trim().slice(0,180)};
            }
          }

          (async()=>{
            const results=[];
            for(const w of pending){
              const r=await one(w);
              results.push(r);
              console.log(JSON.stringify(r));
              await sleep(3500);
            }

            tdoc.version='2026-10-21';
            tdoc.generatedFrom='works.json 2026-10-21';
            tdoc.count=Object.values(tdoc.thumbnails||{}).filter(x=>x&&x.verified&&x.thumbnail).length;
            tdoc.unresolved=wdoc.works.length-tdoc.count;

            const unresolved=wdoc.works.filter(w=>!(tdoc.thumbnails?.[String(w.id)]?.verified&&tdoc.thumbnails?.[String(w.id)]?.thumbnail));
            const old=new Map((qdoc.items||[]).map(x=>[String(x.id),x]));
            qdoc.version='2026-10-21';
            qdoc.items=unresolved.map(w=>{
              const prev=old.get(String(w.id))||{};
              const rr=results.find(x=>String(x.id)===String(w.id));
              return {
                id:w.id,title:w.title||'',artist:w.artist||'',source:w.source||'',url:w.url||'',
                status:rr?(rr.ok?'resolved':'failed'):(prev.status||'pending'),
                error:rr&&!rr.ok?rr.error:(prev.error||''),
                lastChecked:rr?'2026-10-21':(prev.lastChecked||'')
              };
            }).filter(x=>x.status!=='resolved');
            qdoc.total=qdoc.items.length;
            const bySource={};
            for(const x of qdoc.items) bySource[x.source]=(bySource[x.source]||0)+1;
            qdoc.bySource=Object.fromEntries(Object.entries(bySource).sort((a,b)=>b[1]-a[1]));

            fs.writeFileSync(THUMBS,JSON.stringify(tdoc,null,2)+'\n');
            fs.writeFileSync(QUEUE,JSON.stringify(qdoc,null,2)+'\n');

            const ok=results.filter(x=>x.ok).length;
            console.log(JSON.stringify({processed:results.length,ok,failed:results.length-ok,totalVerified:tdoc.count,unresolved:tdoc.unresolved}));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Commit results
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add joseon-gallery/thumbnails.json joseon-gallery/thumbnail-queue.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add next 10 British Museum Kim Jun-geun thumbnails"
          git push origin joseon-gallery
