name: Probe British Museum Kim Jun-geun bulk API

on:
  workflow_dispatch:
  push:
    paths:
      - 'joseon-gallery/bm-kim-scrape.trigger'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: joseon-gallery
      - name: Probe bulk query
        shell: bash
        run: |
          set -euo pipefail
          for Q in             'https://r.jina.ai/https://www.britishmuseum.org/api/_search?keyword%5B%5D=OA%2B%2C0.482.&size=200'             'https://r.jina.ai/https://www.britishmuseum.org/api/_search?keyword%5B%5D=Kim%20Jun-geun&size=200'; do
            echo "QUERY=$Q"
            curl -L --max-time 45 -A 'Mozilla/5.0' -sS "$Q" -o /tmp/out.txt || true
            node <<'NODE'
const fs=require('fs');
const txt=fs.readFileSync('/tmp/out.txt','utf8');
const i=txt.indexOf('{');
if(i<0){console.log('NOJSON');process.exit(0)}
try{
  const j=JSON.parse(txt.slice(i));
  const hits=j?.hits?.hits||[];
  const regs=hits.map(h=>(h._source?.identifier||[]).find(x=>x.registration_number)?.registration_number).filter(Boolean);
  console.log(JSON.stringify({total:j?.hits?.total,hits:hits.length,regs:regs.slice(0,10)}));
}catch(e){console.log('PARSEERR '+e.message)}
NODE
          done
