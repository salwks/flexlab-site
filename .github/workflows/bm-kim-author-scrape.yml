name: Probe British Museum Kim Jun-geun API

on:
  workflow_dispatch:
  push:
    paths:
      - 'joseon-gallery/bm-kim-scrape.trigger'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: joseon-gallery
          fetch-depth: 0

      - name: Probe British Museum search API
        shell: bash
        run: |
          set -euo pipefail
          URL='https://www.britishmuseum.org/api/_search?keyword[]=OA%2B%2C0.482.2'
          echo 'DIRECT:'
          curl -L --max-time 20 -A 'Mozilla/5.0' -sS -D /tmp/direct.h "$URL" -o /tmp/direct.out || true
          head -n 20 /tmp/direct.h || true
          head -c 3000 /tmp/direct.out || true
          echo
          echo 'JINA:'
          JINA='https://r.jina.ai/https://www.britishmuseum.org/api/_search?keyword%5B%5D=OA%2B%2C0.482.2'
          curl -L --max-time 30 -A 'Mozilla/5.0' -sS -D /tmp/jina.h "$JINA" -o /tmp/jina.out || true
          head -n 20 /tmp/jina.h || true
          head -c 5000 /tmp/jina.out || true
